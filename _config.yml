title: "Listening to Auraria's Past"
description: "A Historical Tour of a Displaced Neighborhood"
url: "https://cblevins.github.io"
baseurl: ""

# Contact
contact_email: rachel.gross@ucdenver.edu

# Podcast / audio hosting (fill in when platform is chosen)
podcast:
  spotify_url: ""
  apple_url: ""
  soundcloud_url: ""
  rss_url: ""

# Collections
collections:
  stops:
    output: true
    permalink: /tour/:name/
  transcripts:
    output: false

# Build settings
theme: null
markdown: kramdown
permalink: pretty

# Sass
sass:
  style: compressed

# Exclude from build
exclude:
  - README.md
  - SITEMAP.md
  - Gemfile
  - Gemfile.lock
  - vendor
  # Raw high-res source images — keep in repo, not in published site
  - assets/images/stop-01-drawing.jpeg
